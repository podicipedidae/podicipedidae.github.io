{{ define "main" }}
{{ .Content }}

{{ $pages := where .Site.RegularPages "Section" "blog" }}
{{ if $pages }}
<ul class="blog-posts">
  {{ range $pages.ByDate.Reverse }}
  <li>
    <span>
      <i>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      </i>
    </span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
